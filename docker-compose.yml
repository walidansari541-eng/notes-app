
services:
  app:
    build: .                  # Tells Docker to look for the Dockerfile in the current directory
    container_name: notes_app
    restart: always
    ports:
      - "3000:3000"           # Exposes app locally if you want to test it directly
    environment:
      - DB_HOST=postgres       # <--- LOOK HERE: It uses the service name, not localhost!
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=notes_db
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://myuser:mypassword@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # 2. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: notes_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: notes_db
    ports:
      # Published on 5433 because a native postgres already owns host 5432.
      # Containers still reach it on 5432 over the compose network.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  # 3. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: notes_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 4. Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: notes_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app                  # Wait for the app to start up too

  rabbitmq:
    image: rabbitmq:3-management
    container_name: boot_rabbitmq
    restart: always
    ports:
      - "5672:5672"          # RabbitMQ main port
      - "15672:15672"        # RabbitMQ management UI
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
