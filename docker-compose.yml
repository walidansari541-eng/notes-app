
services:
  app:
    build: .                  # Tells Docker to look for the Dockerfile in the current directory
    container_name: notes_app
    restart: always
    ports:
      - "3000:3000"           # Exposes app locally if you want to test it directly
    environment:
      - DB_HOST=postgres       # <--- LOOK HERE: It uses the service name, not localhost!
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=notes_db
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  # 2. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: notes_postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: notes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  # 3. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: notes_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 4. Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: notes_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app                  # Wait for the app to start up too

volumes:
  postgres_data:
  redis_data: